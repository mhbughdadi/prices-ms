spring.application.name=pricing-ms
server.port=9092

# ============================================================================
# DATASOURCE
# ============================================================================

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/pricing_db
spring.datasource.username=pricing_user
spring.datasource.password=pricing_password

# ============================================================================
# FLYWAY
# ============================================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================================
# JPA / HIBERNATE
# ============================================================================

spring.jpa.hibernate.ddl-auto=validate

# ============================================================================
# Loggers
# ============================================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.apogee=debug
logging.file.name=/application.log
# ============================================================================
# Swagger
# ============================================================================


# ============================================================================
# Spring Boot Date Format Configurations
# ============================================================================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC